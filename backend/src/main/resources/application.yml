spring:
  application:
    name: aivideo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aivideo}
    username: ${DB_USER:aivideo}
    password: ${DB_PASSWORD:aivideo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:aivideo}
    url-expiry-hours: ${S3_URL_EXPIRY_HOURS:168}

server:
  port: 8080
