spring:
  application:
    name: aivideo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aivideo}
    username: ${DB_USER:aivideo}
    password: ${DB_PASSWORD:aivideo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

app:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:aivideo}
    url-expiry-hours: ${S3_URL_EXPIRY_HOURS:168}
  upload:
    max-file-size-mb: ${MAX_UPLOAD_MB:500}
    allowed-extensions: mp4,mov,webm
    allowed-mime-types: video/mp4,video/quicktime,video/webm
    ffprobe-path: ${FFPROBE_PATH:ffprobe}

server:
  port: 8080
