spring:
  application:
    name: aivideo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aivideo}
    username: ${DB_USER:aivideo}
    password: ${DB_PASSWORD:aivideo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
