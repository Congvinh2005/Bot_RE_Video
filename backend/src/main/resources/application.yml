spring:
  application:
    name: aivideo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aivideo}
    username: ${DB_USER:aivideo}
    password: ${DB_PASSWORD:aivideo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

app:
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:aivideo}
    url-expiry-hours: ${S3_URL_EXPIRY_HOURS:168}
  upload:
    max-file-size-mb: ${MAX_UPLOAD_MB:500}
    allowed-extensions: mp4,mov,webm
    allowed-mime-types: video/mp4,video/quicktime,video/webm
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  analysis:
    scene-threshold: ${SCENE_THRESHOLD:0.4}
    max-frames: ${ANALYSIS_MAX_FRAMES:5}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    prompt-version: ${ANALYSIS_PROMPT_VERSION:1}
    language: vi

server:
  port: 8080
